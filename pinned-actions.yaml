# Canonical pinned GitHub Actions. Single source of truth.
#
# The scraper (.github/scripts/update-actions.py) reads this file, resolves
# each tracked major `tag` to a 40-hex SHA via `gh api .../refs/tags/<tag>`,
# and writes ONLY 40-hex SHAs into `.github/workflows/update-oss.yml` (and the
# `sha:` field below), preserving the human-readable `step_comment` on each pin.
#
# The scraper NEVER crosses a tracked major: a major bump (e.g. v4 -> v5)
# is a deliberate human decision. To bump a major, edit `tag:` AND
# `step_comment:` here and review the resulting PR.
actions:
  - owner: actions
    repo: checkout
    tag: v4            # tracked major; scraper resolves to a 40-hex SHA
    sha: 11d5960a326750d5838078e36cf38b85af677262
    workflow: .github/workflows/update-oss.yml
    step_comment: "v4.4.0; pin reviewed 2026-08-04"

  - owner: actions
    repo: setup-python
    tag: v5
    sha: a26af69be951a213d495a4c3e4e4022e16d87065
    workflow: .github/workflows/update-oss.yml
    step_comment: "v5.6.0; pin reviewed 2026-08-04"
