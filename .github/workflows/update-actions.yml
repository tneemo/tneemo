name: update-pinned-actions

# Kept SEPARATE from update-oss.yml so the pin updater and the OSS generator
# are independently auditable (ADR-0001 D5). This workflow opens/updates a
# human-gated PR; it never auto-merges action-SHA changes. Only README-only
# (no action ref) changes are auto-merged, by the script itself.

on:
  schedule:
    - cron: "0 9 * * 0" # weekly, Sunday 09:00 UTC (same cadence as update-oss.yml)
  workflow_dispatch: {}  # manual runs

permissions:
  contents: write        # needed to push the bot branch + commit
  pull-requests: write   # needed to open/update the PR

jobs:
  bump-actions:
    runs-on: ubuntu-latest
    # Never auto-merge action-SHA PRs: this job only opens/updates the PR and
    # lets the script auto-merge README-only changes. No `gh pr merge` of
    # action refs happens here.
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4; SHAs only

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5; SHAs only
        with:
          python-version: "3.12"

      - name: Install PyYAML
        # The toolcache Python from actions/setup-python ships only pip; the
        # scraper needs PyYAML to parse pinned-actions.yaml.
        run: python -m pip install --quiet pyyaml

      - name: Resolve and open/update pinned-action PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/update-actions.py
