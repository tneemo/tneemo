name: verify-pinned-actions

# Health check companion to update-actions.yml. update-actions.yml runs the
# scraper and opens/updates the human-gated SHA-pin PR; this workflow
# VERIFIES (dry-run only) that every tracked tag still resolves to a 40-hex
# SHA, failing the weekly check if any pin is broken. It never writes to the
# repo and never opens a PR. Kept as a separate file so the SHA pins have a
# stable consumer on disk (pinned-actions.yaml -> .github/workflows/update-oss.yml).

on:
  schedule:
    - cron: "0 9 * * 0" # semanal: domingo 09:00 UTC
  workflow_dispatch: {} # permite rodar manualmente

permissions:
  contents: read

jobs:
  verify-oss:
    runs-on: ubuntu-latest
    steps:
      # v4.4.0; pin reviewed 2026-08-04. Update only via a reviewed Dependabot PR.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # v5.6.0; pin reviewed 2026-08-04. Update only via a reviewed Dependabot PR.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install PyYAML
        # The toolcache Python from actions/setup-python ships only pip; the
        # scraper needs PyYAML to parse pinned-actions.yaml.
        run: python -m pip install --quiet pyyaml

      - name: Verify tracked pins still resolve to 40-hex SHAs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --dry-run resolves and prints, writes nothing, opens no PR. Exit 2
        # if any tracked tag fails to resolve to a 40-hex SHA.
        run: python .github/scripts/update-actions.py --dry-run
