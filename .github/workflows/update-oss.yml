name: update-oss-section

on:
  schedule:
    - cron: "0 9 * * 0" # semanal: domingo 09:00 UTC
  workflow_dispatch: {} # permite rodar manualmente

permissions:
  contents: read

jobs:
  update-oss:
    runs-on: ubuntu-latest
    steps:
      # v4.4.0; pin reviewed 2026-08-04. Update only via a reviewed Dependabot PR.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # v5.6.0; pin reviewed 2026-08-04. Update only via a reviewed Dependabot PR.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Generate OSS section from GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/generate-oss-section.py

      # NOTE: the direct-to-main "Commit if changed" push was REMOVED. The
      # OSS-section refresh is now owned by .github/workflows/update-actions.yml,
      # which opens/auto-merges a README-only PR (no action ref, no trust
      # boundary). This file must never contain a `git push` of any action ref.
