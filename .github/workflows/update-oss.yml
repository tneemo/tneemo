name: update-oss-section

on:
  schedule:
    - cron: "0 9 * * 0" # semanal: domingo 09:00 UTC
  workflow_dispatch: {} # permite rodar manualmente

permissions:
  contents: write

jobs:
  update-oss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate OSS section from GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/generate-oss-section.py

      - name: Commit if changed
        run: |
          git config user.name "tneemo[bot]"
          git config user.email "tneemo@users.noreply.github.com"
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "docs: refresh OSS contributions from API [skip ci]"
            git push origin main
            echo "README atualizado"
          else
            echo "sem mudanças — nada a commitar"
          fi
